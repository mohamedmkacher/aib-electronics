@if (isSearchOpen$ | async) {
  <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm animate-fade-in" (click)="closeSearch()">
    <div class="container mx-auto px-4 pt-20" (click)="$event.stopPropagation()">
      <div class="relative">
        <input
          type="text"
          placeholder="Search for products..."
          class="w-full p-4 text-lg text-white bg-gray-800 border border-gray-700 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          (input)="onSearch($event)"
          autofocus
        />
        <div *ngIf="results$ | async as results" class="absolute mt-2 w-full bg-gray-800 border border-gray-700 rounded-lg shadow-lg">
          @for (product of results; track product.id) {
            <div class="p-4 border-b border-gray-700 hover:bg-gray-700 cursor-pointer" (click)="goToProduct(product.slug)">
              <div class="flex items-center">
                <img [src]="product.mainImageUrl" class="w-12 h-12 object-cover mr-4 rounded">
                <div>
                  <h4 class="text-white font-semibold">{{ product.name }}</h4>
                  <p class="text-gray-400">{{ product.currentPrice | currency:'TND' }}</p>
                </div>
              </div>
            </div>
          }
          @if (results.length === 0) {
            <div class="p-4 text-gray-400">No results found.</div>
          }
        </div>
      </div>
    </div>
  </div>
}
