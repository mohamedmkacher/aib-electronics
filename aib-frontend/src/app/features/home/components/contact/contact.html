<!-- contact.component.html - CYBER-TECH REDESIGN -->
<div class="min-h-screen py-8 lg:py-12">
  <div class="container mx-auto px-4 lg:px-8">

    <!-- Page Header -->
    <div class="text-center mb-12 lg:mb-16">
      <span class="inline-block px-4 py-2 text-sm font-['Orbitron'] font-semibold tracking-[0.2em] uppercase
                   text-[#ff00ff] border border-[#ff00ff]/30 rounded-full
                   bg-[#ff00ff]/5 backdrop-blur-sm mb-6 animate-slide-down">
        Get in Touch
      </span>

      <h1 class="text-4xl lg:text-5xl font-['Orbitron'] font-bold text-white mb-4 animate-slide-up">
        Contact <span class="text-gradient">Us</span>
      </h1>

      <p class="text-[#a0a0c0] text-lg max-w-2xl mx-auto animate-slide-up delay-100">
        Have questions? We'd love to hear from you. We'll respond as soon as possible.
      </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-1 gap-8 lg:gap-12">


      <!-- Contact Info -->
      <div class="space-y-12 animate-slide-left">

        <!-- Info Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">

          <!-- Address -->
          <div class="glass-card p-6 group hover:border-[#00f0ff]/30 transition-colors">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#00f0ff]/20 to-[#00ff88]/20
                        flex items-center justify-center mb-4
                        group-hover:from-[#00f0ff]/30 group-hover:to-[#00ff88]/30 transition-colors">
              <svg class="w-6 h-6 text-[#00f0ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
              </svg>
            </div>
            <h3 class="text-white font-semibold mb-1">Visit Us</h3>
            <p class="text-[#a0a0c0] text-sm">Route SOUKRA Km1<br>Sfax, Tunisia 3003</p>
          </div>

          <!-- Phone -->
          <div class="glass-card p-6 group hover:border-[#ff00ff]/30 transition-colors">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#ff00ff]/20 to-[#a855f7]/20
                        flex items-center justify-center mb-4
                        group-hover:from-[#ff00ff]/30 group-hover:to-[#a855f7]/30 transition-colors">
              <svg class="w-6 h-6 text-[#ff00ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
            </div>
            <h3 class="text-white font-semibold mb-1">Call Us</h3>
            <p class="text-[#a0a0c0] text-sm">+216 26 790 970<br>Mon-Sat 8am-6pm</p>
          </div>

          <!-- Email -->
          <div class="glass-card p-6 group hover:border-[#00ff88]/30 transition-colors">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#00ff88]/20 to-[#00f0ff]/20
                        flex items-center justify-center mb-4
                        group-hover:from-[#00ff88]/30 group-hover:to-[#00f0ff]/30 transition-colors">
              <svg class="w-6 h-6 text-[#00ff88]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
              </svg>
            </div>
            <h3 class="text-white font-semibold mb-1">Email Us</h3>
            <p class="text-[#a0a0c0] text-sm">contact@aib.com</p>
          </div>

          <!-- Hours -->
          <div class="glass-card p-6 group hover:border-[#a855f7]/30 transition-colors">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-[#a855f7]/20 to-[#ff00ff]/20
                        flex items-center justify-center mb-4
                        group-hover:from-[#a855f7]/30 group-hover:to-[#ff00ff]/30 transition-colors">
              <svg class="w-6 h-6 text-[#a855f7]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </div>
            <h3 class="text-white font-semibold mb-1">Working Hours</h3>
            <p class="text-[#a0a0c0] text-sm">Mon-Fri: 9am-6pm<br>Sat: 10am-4pm</p>
          </div>
        </div>


      </div>
    </div>
  </div>
</div>
